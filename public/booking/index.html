<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer">
  <title>PLAYGRAND 予約</title><link rel="stylesheet" href="/booking/style.css"><style>[hidden]{display:none!important}</style>
</head>
<body>
  <header><div class="brand"><img src="/booking/jiyugaoka-logo.png" alt="JIYUGAOKA GYM PLAYGRAND" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden>JIYUGAOKA GYM PLAYGRAND</span></div></header>
  <main>
    <section id="loading" class="card center">予約画面を準備しています…</section>
    <section id="app" hidden>
      <div class="hello"><div class="customer-line"><div><strong id="name"></strong> 様</div><div id="member" class="member"></div></div><span>ご希望の空き時間をお選びください</span></div>
      <div id="stores" class="tabs"></div>
      <div class="week-head"><button id="prev">‹</button><strong id="range"></strong><button id="next">›</button></div>
      <div id="schedule" class="schedule"><div class="empty">空き枠を確認しています…</div></div>
    </section>
    <section id="error" class="card error" hidden></section>
  </main>
  <div id="selectionBar" class="selection-bar" hidden><span><strong id="selectionCount">0</strong>件選択中</span><button id="reviewSelections">まとめて予約する</button></div>
  <div id="modal" class="modal" hidden><div class="dialog"><h2>予約内容の確認</h2><div id="summary"></div><button id="confirm" class="primary">この内容で予約する</button><button id="cancel" class="secondary">戻る</button></div></div>
  <script src="/booking/app.js"></script>
</body></html>
