<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PLAYGRAND 体験予約</title><link rel="stylesheet" href="/booking/style.css"><link rel="stylesheet" href="/trial/style.css"><style>[hidden]{display:none!important}</style></head>
<body><header><div class="brand"><img src="/booking/jiyugaoka-logo.png" alt="PLAYGRAND"></div></header><main>
<section id="loading" class="card">体験予約画面を準備しています…</section><section id="app" hidden><div class="hello"><strong>体験トレーニング予約</strong><br><span>ご希望の空き時間をお選びください</span></div><div id="stores" class="tabs"></div><div class="week-head"><button id="prev">‹</button><strong id="range"></strong><button id="next">›</button></div><div id="schedule" class="schedule"></div></section><section id="error" class="card error" hidden></section></main>
<div id="modal" class="modal" hidden><div class="dialog"><h2>お客様情報</h2><div id="chosen"></div><label>氏名（必須）<input id="trialName" autocomplete="name"></label><label>電話番号（必須）<input id="phone" type="tel" autocomplete="tel"></label><label>メールアドレス（任意）<input id="email" type="email" autocomplete="email"></label><p class="price">体験料金（税込）<strong>6,000円</strong></p><button id="pay" class="primary">Squareで支払って予約する</button><button id="cancel" class="secondary">戻る</button></div></div>
<script src="/trial/app.js"></script></body></html>
